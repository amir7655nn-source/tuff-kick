name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown at the bottom of the account menu
    validations: {required: true}
  - type: input
    id: device
    attributes:
      label: Phone and Android version
  - type: textarea
    id: what
    attributes:
      label: What happened and what did you expect?
    validations: {required: true}
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: Never paste tokens, cookies or passwords.
